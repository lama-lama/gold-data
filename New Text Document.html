<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ المذكرات التربوية بالذكاء الاصطناعي</title>
    <!-- Tailwind CSS لتنسيق واجهة عصري ومستجيب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-8">
        
        <!-- الهيدر -->
        <div class="text-center mb-8 border-b pb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-900">مولّد المذكرات التربوية بالذكاء الاصطناعي</h1>
            <p class="text-gray-600 mt-2">وفق المخططات والتوجيهات التربوية لوزارة التربية الوطنية الجزائرية</p>
        </div>

        <!-- نموذج إدخال البيانات -->
        <form id="lessonForm" class="space-y-4">
            
            <!-- مفتاح API -->
            <div>
                <label class="block font-semibold text-gray-700 mb-1">مفتاح Gemini API:</label>
                <input type="password" id="apiKey" required placeholder="أدخل مفتاح Gemini API هنا" 
                       class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <span class="text-xs text-gray-500">يمكنك الحصول على مفتاح مجاني من Google AI Studio</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- المستوى الدراسي -->
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">المرحلة / المستوى:</label>
                    <select id="level" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <optgroup label="التعليم المتوسط">
                            <option value="1 متوسط">السنة الأولى متوسط</option>
                            <option value="2 متوسط">السنة الثانية متوسط</option>
                            <option value="3 متوسط">السنة الثالثة متوسط</option>
                            <option value="4 متوسط">السنة الرابعة متوسط</option>
                        </optgroup>
                        <optgroup label="التعليم الثانوي">
                            <option value="1 ثانوي">السنة الأولى ثانوي</option>
                            <option value="2 ثانوي">السنة الثانية ثانوي</option>
                            <option value="3 ثانوي">السنة الثالثة ثانوي</option>
                        </optgroup>
                        <optgroup label="التعليم الابتدائي">
                            <option value="1 ابتدائي">السنة الأولى ابتدائي</option>
                            <option value="2 ابتدائي">السنة الثانية ابتدائي</option>
                            <option value="3 ابتدائي">السنة الثالثة ابتدائي</option>
                            <option value="4 ابتدائي">السنة الرابعة ابتدائي</option>
                            <option value="5 ابتدائي">السنة الخامسة ابتدائي</option>
                        </optgroup>
                    </select>
                </div>

                <!-- المادة -->
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">المادة:</label>
                    <input type="text" id="subject" required placeholder="مثال: اللغة العربية، الرياضيات، علوم..." 
                           class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- رقم المذكر / الدرس -->
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">عنوان المقطع / الميدان:</label>
                    <input type="text" id="section" required placeholder="مثال: الأخلاق والمجتمع / الظواهر الكهربائية" 
                           class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- عنوان الدرس -->
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">عنوان الدرس (المورد المعرفي):</label>
                    <input type="text" id="lessonTitle" required placeholder="مثال: عطف النسق / الدارة الكهربائية" 
                           class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- الهدف التعلمي / المركبة المستهدفة -->
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">الأهداف التعلمية / المركبة:</label>
                    <input type="text" id="objectives" placeholder="مثال: أن يتعرف التلميذ على حروف العطف ويعربها" 
                           class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- زر التوليد -->
            <button type="submit" id="generateBtn" 
                    class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                إنشاء المذكرة التربوية
            </button>
        </form>

        <!-- مؤشر التحميل -->
        <div id="loading" class="hidden text-center my-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
            <p class="mt-2 text-gray-600">جاري صياغة المذكرة وفق المنهاج الوزاري...</p>
        </div>

        <!-- منطقة عرض المذكرة -->
        <div id="resultContainer" class="hidden mt-8 border-t pt-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">المذكرة التربوية الناتجة:</h2>
                <button onclick="window.print()" class="bg-gray-800 text-white px-4 py-1.5 rounded text-sm hover:bg-gray-900">
                    طباعة / حفظ PDF
                </button>
            </div>
            
            <div id="output" class="bg-gray-50 border p-6 rounded-lg text-gray-800 leading-relaxed overflow-x-auto">
                <!-- هنا سيتم إدراج المذكرة -->
            </div>
        </div>

    </div>

    <!-- كود الربط بالذكاء الاصطناعي -->
    <script>
        document.getElementById('lessonForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const apiKey = document.getElementById('apiKey').value.trim();
            const level = document.getElementById('level').value;
            const subject = document.getElementById('subject').value;
            const section = document.getElementById('section').value;
            const lessonTitle = document.getElementById('lessonTitle').value;
            const objectives = document.getElementById('objectives').value;

            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const output = document.getElementById('output');

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            // إعداد الموجّه (Prompt) الموجه خصيصاً للمنهاج الجزائري
            const promptText = `
أنت مستشار تربوي وخبير في مناهج وزارة التربية الوطنية الجزائرية.
قم بإعداد مذكرة تربوية (بطاقة بيداغوجية) كاملة ومنظمة في جدول HTML مناسب للطباعة بناءً على المعطيات التالية:

- المستوى: ${level}
- المادة: ${subject}
- الميدان / المقطع التعلمي: ${section}
- عنوان الدرس (المورد المعرفي): ${lessonTitle}
- الأهداف التعلمية (المركبة المستهدفة): ${objectives || 'اكتب الأهداف المناسبة وفق المنهاج'}

يرجى بناء المذكرة وفق الهيكلة الرسمية الجزائرية للبطاقات التربوية:
1. **الترويسة:** (المؤسسة، المادة، المستوى، الميدان، المورد المعرفي، الوسائل التعليمية، المركبات الكفاءة، تقويم التشخيص).
2. **جدول سير الدرس (مراحل وضعية التعلم):**
   - **مراحل التعلم:** 
     * وضعية الانطلاق (التقويم التشخيصي / إثارة الوضعية المشكلة الأمه أو الجزئية)
     * بناء التعلمات (المهمات، الأنشطة، وتدوين الأثر الكتابي)
     * استثمار التعلمات / الإدماج والتقويم (تطبيق أو تمرين تقويمي)
   - **سير النشاط (مهام الأستاذ والتلميذ):** شرح خطوة بخطوة.
   - **معايير ومؤشرات التقويم.**

ملاحظة مهمة: قم بصياغة المذكرة باللغة العربية الفصحى، واستخدم تنسيق جداول HTML أنيق وأنيق بدون وضع أوسمة markdown حول الكود (أعطني كود HTML جاهز للعرض مباشرة).
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let content = data.candidates[0].content.parts[0].text;
                    // تنظيف النص إذا أرجع الموديل علامات ```html
                    content = content.replace(/```html/g, '').replace(/```/g, '');
                    output.innerHTML = content;
                    resultContainer.classList.remove('hidden');
                } else {
                    alert('حدث خطأ في استجابة الذكاء الاصطناعي، يرجى التأكد من مفتاح API.');
                }
            } catch (err) {
                alert('فشل الاتصال بالخدمة. تأكد من صحة المفتاح والاتصال بالإنترنت.');
                console.error(err);
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
